name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button: redeploy + reinstall on the iPhone
  schedule:
    - cron: "30 17 * * *" # daily 17:30 UTC: keeps the free-team iPhone build from expiring (7 days)

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Runs on GitHub's own machines, for every PR and push. Fork PRs never reach the Mac.
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build

  # Builds the production image and smoke-tests it (health + a deep link).
  image:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --target runtime -t garaj-web:ci .
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8080:80 garaj-web:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -qi "<html"
          curl -fsS "http://localhost:8080/customers/detail/?id=x" | grep -qi "<html"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/does-not-exist/)
          test "$code" = "404"
          docker rm -f smoke

  # Only on pushes to main, only on the self-hosted Mac (see docs/DEPLOY.md).
  deploy:
    needs: [check, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Deploy container
        env:
          GARAJ_TAG: ${{ github.sha }}
        run: |
          export GARAJ_TAG="${GARAJ_TAG:0:7}"
          docker compose build web
          docker tag "garaj-web:${GARAJ_TAG}" garaj-web:latest
          docker compose up -d --remove-orphans web
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' garaj-web 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          echo "health: $status"
          test "$status" = "healthy"
          # keep the five newest images for quick rollback
          docker images garaj-web --format '{{.CreatedAt}}|{{.Tag}}' | sort -r | awk -F'|' '{print $2}' \
            | grep -vE '^(latest|ci)$' | tail -n +6 | xargs -I{} docker rmi "garaj-web:{}" || true
          docker image prune -f

  # Builds the iPhone app and installs it, when a paired iPhone is reachable.
  # No phone connected = skipped (green), never a failed pipeline. Only from main.
  ios:
    needs: [check]
    if: >-
      ${{ !cancelled() && (needs.check.result == 'success' || needs.check.result == 'skipped')
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    concurrency:
      group: ios-device
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Look for the iPhone
        id: device
        run: |
          set +e
          bash scripts/ios-device.sh --check
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 3 ]; then
            echo "::notice::No iPhone reachable (cable or Wi-Fi, unlocked, trusted). Skipping the iOS install."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi
      - name: Build and install on the iPhone
        if: steps.device.outputs.found == 'true'
        env:
          IOS_LAUNCH: "0"
        run: |
          npm ci --no-audit --no-fund
          bash scripts/ios-device.sh
